name: kotoha
description: "A multilingual workspace for work on your device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: 3.0.8
  win32: 6.4.0
  path_provider: 2.1.6
  ffi: 2.2.0
  file_selector_macos: 0.9.5+2
  file_selector_windows: 0.9.3+6
  file_selector_platform_interface: 2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/licenses/Unicode-3.0.txt
    - assets/licenses/crypto-3.0.8.txt
