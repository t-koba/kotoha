name: Native engine probe

# Only changed probe/source inputs trigger this developer experiment.
# Automatic runs on reviewed publications also provide exact-SHA evidence.
on:
  push:
    branches: [mizu]
    paths:
      - .github/workflows/engine-probe.yml
      - tools/engine_probe/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cpu:
    name: Windows x64 CPU feasibility
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENGINE_BUILD_JOBS: '2'
      ENGINE_PROBE_TIMEOUT_SECONDS: '180'
      ENGINE_PROBE_OUTPUT_BYTES: '8192'
      ENGINE_PROBE_TOKENS: '16'
      ENGINE_DOWNLOAD_TIMEOUT_SECONDS: '300'
      # Explicit acceptance of the reviewed complete terms for this developer test ONLY.
      ENGINE_ACCEPT_TERMS_SHA256: '832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python validation and output boundaries (synthetic files, not inference)
        shell: pwsh
        run: |
          "ENGINE_MODEL_DIR=$env:RUNNER_TEMP/kotoha-engine-model" >> $env:GITHUB_ENV
          python -m unittest discover -s tools/engine_probe -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure developer-only Windows x64 CPU engine probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/engine-probe/.cmake/api/v1/query | Out-Null
          New-Item -ItemType File -Force build/engine-probe/.cmake/api/v1/query/codemodel-v2 | Out-Null
          cmake -S tools/engine_probe -B build/engine-probe -A x64 2>&1 | Tee-Object -FilePath build/engine-probe/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build upstream llama-simple (not linked to Flutter)
        shell: pwsh
        run: |
          cmake --build build/engine-probe --config Release --target llama-simple --parallel $env:ENGINE_BUILD_JOBS -- /verbosity:normal 2>&1 | Tee-Object -FilePath build/engine-probe/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Acquire only the reviewed public test fixtures outside the workspace
        timeout-minutes: 10
        shell: pwsh
        run: |
          python tools/engine_probe/acquire.py --directory $env:ENGINE_MODEL_DIR --accept-terms-sha256 $env:ENGINE_ACCEPT_TERMS_SHA256 --timeout-seconds $env:ENGINE_DOWNLOAD_TIMEOUT_SECONDS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real loader rejections and consent-bound public translation smoke
        shell: pwsh
        run: |
          python tools/engine_probe/smoke.py --executable build/engine-probe/bin/Release/llama-simple.exe --timeout-seconds $env:ENGINE_PROBE_TIMEOUT_SECONDS --output-bytes $env:ENGINE_PROBE_OUTPUT_BYTES --fixture-dir $env:ENGINE_MODEL_DIR --accept-terms-sha256 $env:ENGINE_ACCEPT_TERMS_SHA256 --tokens $env:ENGINE_PROBE_TOKENS 2>&1 | Tee-Object -FilePath build/engine-probe/smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove downloaded test weights, complete terms and card
        if: always()
        shell: pwsh
        run: |
          if ($env:ENGINE_MODEL_DIR -and (Test-Path -LiteralPath $env:ENGINE_MODEL_DIR)) {
            Remove-Item -LiteralPath $env:ENGINE_MODEL_DIR -Recurse -Force -ErrorAction Stop
          }
      - name: Record selected actual compiler reads for review
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $pwd 'build/engine-probe/_deps/llama_cpp-src'
          # Preserve complete UTF-8 tracking text, including split read logs.
          $build = 'build/engine-probe/_deps/llama_cpp-build'
          if (Test-Path -LiteralPath $build) {
            Get-ChildItem -LiteralPath $build -Recurse -File -Filter '*.read.*.tlog' | ForEach-Object {
              Get-Content -LiteralPath $_.FullName | Set-Content -LiteralPath ($_.FullName + '.txt') -Encoding utf8
            }
          }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC provider root missing' }
          if ([string]::IsNullOrWhiteSpace($env:SystemRoot)) { throw 'Windows provider SystemRoot missing' }
          $sdk = Get-ItemPropertyValue 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10
          python tools/engine_probe/compiler_reads.py --source $source --generated $build --msvc (Join-Path $vs 'VC/Tools/MSVC') --sdk $sdk --windows $env:SystemRoot --output build/engine-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record executable linkage for review
        if: always()
        shell: pwsh
        run: |
          $exe = 'build/engine-probe/bin/Release/llama-simple.exe'
          if (Test-Path $exe) {
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
            if (-not $dumpbin) { throw 'dumpbin not found; linkage evidence missing' }
            & $dumpbin /HEADERS /DEPENDENTS $exe 2>&1 | Tee-Object -FilePath build/engine-probe/linkage.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File build/engine-probe/executable-sha256.txt
          }
      - name: Retain developer engine build and audit inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-engine-probe
          include-hidden-files: true
          path: |
            tools/engine_probe/
            build/engine-probe/*.log
            build/engine-probe/*sha256.txt
            build/engine-probe/compiler-summary.txt
            build/engine-probe/CMakeCache.txt
            build/engine-probe/CMakeFiles/CMakeConfigureLog.yaml
            build/engine-probe/.cmake/api/v1/reply/
            build/engine-probe/**/*.vcxproj
            build/engine-probe/_deps/llama_cpp-build/src/CMakeFiles/llama.dir/Unity/*.cxx
            build/engine-probe/_deps/llama_cpp-build/src/llama-version.h
            build/engine-probe/_deps/llama_cpp-build/ggml/src/ggml-version.h
            build/engine-probe/_deps/llama_cpp-build/**/*.read.*.tlog.txt
            build/engine-probe/_deps/llama_cpp-src/**/CMakeLists.txt
            build/engine-probe/_deps/llama_cpp-src/**/*.cmake
            build/engine-probe/_deps/llama_cpp-src/**/LICENSE*
            build/engine-probe/_deps/llama_cpp-src/**/COPYING*
            build/engine-probe/_deps/llama_cpp-src/**/NOTICE*

  android-cpu:
    name: Android API 35 x86_64 CPU feasibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENGINE_BUILD_ROOT: build/engine-probe-android
      ENGINE_BUILD_JOBS: '2'
      # Read from Flutter 3.47.9 FlutterExtension.kt, checked again before build.
      ENGINE_NDK_VERSION: '28.2.13676358'
      ENGINE_API: '35'
      ENGINE_ABI: x86_64
      ENGINE_SYSTEM_IMAGE: system-images;android-35;default;x86_64
      ENGINE_AVD_DEVICE: pixel_2
      ENGINE_EMULATOR_PORT: '5554'
      ENGINE_BOOT_SECONDS: '180'
      ENGINE_BOOT_POLL_SECONDS: '2'
      ENGINE_ADB_SECONDS: '30'
      ENGINE_PROBE_SECONDS: '180'
      ENGINE_OUTPUT_BYTES: '8192'
      ENGINE_LINKER_MAP_MAX_BYTES: '134217728' # 128 MiB; reject rather than truncate
      ENGINE_TOKENS: '16'
      ENGINE_DOWNLOAD_SECONDS: '300'
      ENGINE_DEVICE_ROOT: /data/local/tmp
      # Developer synthetic test ONLY, not stored product/user consent.
      ENGINE_ACCEPT_TERMS_SHA256: '832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Flutter toolchain defaults
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Check orchestration (synthetic files/transport, not native evidence)
        run: python3 -m unittest discover -s tools/engine_probe -p 'test_*.py' -v
      - name: Cross-build, capture selected reads and run real owned-emulator inference
        env:
          ENGINE_TEMP_ROOT: ${{ runner.temp }}
        run: bash tools/engine_probe/android_ci.sh
      - name: Retain Android developer build and audit inputs (never weights)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-api35-x86_64-engine-probe
          include-hidden-files: true
          path: |
            tools/engine_probe/
            build/engine-probe-android/*.log
            build/engine-probe-android/*.txt
            build/engine-probe-android/*.map
            build/engine-probe-android/*.map.sha256.json
            build/engine-probe-android/ndk.properties
            build/engine-probe-android/compile_commands.json
            build/engine-probe-android/build.ninja
            build/engine-probe-android/.ninja_log
            build/engine-probe-android/.ninja_deps
            build/engine-probe-android/CMakeFiles/rules.ninja
            build/engine-probe-android/CMakeFiles/CMakeConfigureLog.yaml
            build/engine-probe-android/_deps/llama_cpp-build/src/CMakeFiles/llama.dir/Unity/*.cxx
            build/engine-probe-android/_deps/llama_cpp-build/src/llama-version.h
            build/engine-probe-android/_deps/llama_cpp-build/ggml/src/ggml-version.h
