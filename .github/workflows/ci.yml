name: CI

on:
  push:
    branches:
      - dev
      - mizu
      - mizu/dev
  pull_request:
  workflow_dispatch:
    # Exact-publication dispatches carry no inputs, so defaults select the bounded profile.
    inputs:
      profile_bytes:
        description: 'Synthetic profile bytes: 65536, 2097152, or 16777216; no-input dispatch defaults to 65536'
        default: '65536'
        type: string
      profile_editor:
        description: 'Run macOS editor profile (up to 2 MiB); defaults: 60s, 4096 MiB RSS, 0.5s poll'
        default: true
        type: boolean
      profile_seconds:
        description: 'macOS editor watchdog wall seconds'
        default: '60'
        type: string
      profile_rss_mib:
        description: 'macOS editor process-group sampled RSS ceiling MiB'
        default: '4096'
        type: string
      profile_poll_seconds:
        description: 'macOS editor watchdog sampling interval seconds'
        default: '0.5'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design-contracts:
    name: Design contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate opt-in profile bounds
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != ''
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
          PROFILE_EDITOR: ${{ inputs.profile_editor }}
          PROFILE_SECONDS: ${{ inputs.profile_seconds }}
          PROFILE_RSS_MIB: ${{ inputs.profile_rss_mib }}
          PROFILE_POLL_SECONDS: ${{ inputs.profile_poll_seconds }}
        run: |
          python3 - <<'PY'
          import math
          import os
          import sys

          size = os.environ['PROFILE_BYTES']
          if size not in {'65536', '2097152', '16777216'}:
              sys.exit('profile_bytes must be 65536, 2097152, or 16777216')
          if os.environ['PROFILE_EDITOR'].lower() != 'true':
              raise SystemExit(0)
          if size == '16777216':
              sys.exit('16 MiB editor profile is disabled; the previous sandbox widget run did not complete and the RSS sampler is not a hard allocation limit')
          try:
              seconds, rss_mib, poll_seconds = map(float, (
                  os.environ['PROFILE_SECONDS'], os.environ['PROFILE_RSS_MIB'],
                  os.environ['PROFILE_POLL_SECONDS']))
          except ValueError:
              sys.exit('editor watchdog inputs must be finite positive numbers')
          if (not all(map(math.isfinite, (seconds, rss_mib, poll_seconds)))
                  or not 0 < seconds <= 120
                  or not 0 < rss_mib <= 4096
                  or not 0.05 <= poll_seconds <= 0.5):
              sys.exit('editor watchdog bounds: seconds <= 120, RSS <= 4096 MiB, poll 0.05–0.5 seconds')
          PY
      - name: Validate design contracts
        run: python3 design/specs/validate_specs.py

  flutter-tests:
    name: Flutter format, analysis, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tools
      - name: Analyze Flutter code
        run: flutter analyze --no-pub
      - name: Test external profile watchdog
        run: python3 -m unittest tools/test_watch_import_profile.py
      - name: Run Flutter tests
        run: flutter test --no-pub

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Set up Java for Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      # Callback/flag + native accessibility/input coverage, not OS thumbnails,
      # TalkBack speech/gestures, physical devices/keyboards, or every launcher/OEM.
      - name: Check privacy callbacks and accessibility on Android Emulator
        timeout-minutes: 15
        env:
          ANDROID_SYSTEM_IMAGE: system-images;android-35;default;x86_64
          ANDROID_AVD_DEVICE: pixel_2
          ANDROID_BOOT_TIMEOUT_SECONDS: '180'
          ANDROID_BOOT_POLL_SECONDS: '2'
          ANDROID_TEST_TIMEOUT: 7m
          ANDROID_AX_TIMEOUT_MILLIS: '10000'
          ANDROID_AX_POLL_MILLIS: '100'
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager "platform-tools" "emulator" "$ANDROID_SYSTEM_IMAGE"
          echo no | avdmanager create avd --force --name kotoha-privacy \
            --package "$ANDROID_SYSTEM_IMAGE" --device "$ANDROID_AVD_DEVICE"
          test -s "$ANDROID_AVD_HOME/kotoha-privacy.ini" || {
            echo "AVD metadata missing from $ANDROID_AVD_HOME" >&2
            exit 1
          }
          emulator -avd kotoha-privacy -port 5554 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on \
            > "$RUNNER_TEMP/kotoha-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            tail -n 80 "$RUNNER_TEMP/kotoha-emulator.log"
          }
          trap cleanup EXIT
          export emulator_pid
          timeout "${ANDROID_BOOT_TIMEOUT_SECONDS}s" bash -c '
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do
              kill -0 "$emulator_pid" || exit 1
              sleep "$ANDROID_BOOT_POLL_SECONDS"
            done
          '
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          # Capture native profile output even when Gradle or instrumentation fails.
          if [[ -n "$PROFILE_BYTES" ]]; then
            adb logcat -c
            trap 'adb logcat -d -s KotohaImportProfile:I || true; cleanup' EXIT
          fi
          cd android
          timeout "$ANDROID_TEST_TIMEOUT" ./gradlew --no-daemon :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=org.kotoha.app.MainActivityPrivacyTest,org.kotoha.app.MainActivityAccessibilityTest,org.kotoha.app.TextImportTest \
            -Pandroid.testInstrumentationRunnerArguments.axTimeoutMillis="$ANDROID_AX_TIMEOUT_MILLIS" \
            -Pandroid.testInstrumentationRunnerArguments.axPollMillis="$ANDROID_AX_POLL_MILLIS" \
            -Pandroid.testInstrumentationRunnerArguments.profileBytes="$PROFILE_BYTES"

  apple:
    name: iOS and macOS debug builds
    runs-on: macos-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign --no-pub
      # Native cover callbacks + XCUI accessibility/input only: no OS thumbnails,
      # VoiceOver speech/gestures or physical devices/keyboards. Missing profiles fail.
      - name: Test iOS privacy callbacks and accessibility on Simulator
        timeout-minutes: 15
        env:
          IOS_SIMULATOR_OS: '26.2'
          IOS_SIMULATOR_DEVICE: iPhone 17
          IOS_DESTINATION_TIMEOUT_SECONDS: '60'
          IOS_TEST_TIMEOUT_SECONDS: '120'
          IOS_AX_TIMEOUT_SECONDS: '10'
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        run: |
          set -euo pipefail
          # Require the software keyboard for XCUI text input; no physical keyboard is used.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,OS=$IOS_SIMULATOR_OS,name=$IOS_SIMULATOR_DEVICE" \
            -destination-timeout "$IOS_DESTINATION_TIMEOUT_SECONDS" \
            -only-testing:RunnerTests/RunnerTests \
            -only-testing:RunnerUITests/LanguageFieldAccessibilityTests \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance "$IOS_TEST_TIMEOUT_SECONDS" \
            -maximum-test-execution-time-allowance "$IOS_TEST_TIMEOUT_SECONDS" \
            KOTOHA_AX_TIMEOUT_SECONDS="$IOS_AX_TIMEOUT_SECONDS" KOTOHA_IMPORT_PROFILE_BYTES="$PROFILE_BYTES" CODE_SIGNING_ALLOWED=NO
      - name: Profile desktop disk read and strict decode
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != ''
        timeout-minutes: 5
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        run: flutter test --no-pub tools/profile_text_import_test.dart --dart-define=PROFILE_BYTES="$PROFILE_BYTES" --dart-define=PROFILE_STAGE=decode
      - name: Profile macOS debug editor with external watchdog
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != '' && inputs.profile_editor
        timeout-minutes: 5
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
          PROFILE_SECONDS: ${{ inputs.profile_seconds }}
          PROFILE_RSS_MIB: ${{ inputs.profile_rss_mib }}
          PROFILE_POLL_SECONDS: ${{ inputs.profile_poll_seconds }}
        run: >-
          python3 tools/watch_import_profile.py --seconds "$PROFILE_SECONDS"
          --rss-mib "$PROFILE_RSS_MIB" --poll-seconds "$PROFILE_POLL_SECONDS" --
          flutter test --no-pub tools/profile_text_import_test.dart
          --dart-define=PROFILE_BYTES="$PROFILE_BYTES" --dart-define=PROFILE_STAGE=editor
      - name: Build unsigned macOS app
        run: flutter build macos --debug --no-pub

  windows:
    name: Windows debug build
    runs-on: windows-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable Windows desktop target
        run: flutter config --enable-windows-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test Windows DPAPI key preservation
        run: flutter test --no-pub test/windows_dpapi_test.dart
      - name: Profile desktop disk read and strict decode
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != ''
        timeout-minutes: 5
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        run: flutter test --no-pub tools/profile_text_import_test.dart --dart-define=PROFILE_BYTES="$env:PROFILE_BYTES" --dart-define=PROFILE_STAGE=decode
      - name: Build Windows debug app
        run: flutter build windows --debug --no-pub
