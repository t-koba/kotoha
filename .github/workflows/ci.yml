name: CI

on:
  push:
    branches:
      - dev
      - mizu/dev
  pull_request:
  workflow_dispatch:
    # Exact-publication dispatches carry no inputs, so defaults select the bounded profile.
    inputs:
      profile_bytes:
        description: 'Synthetic profile bytes: 65536, 2097152, or 16777216; no-input dispatch defaults to 65536'
        default: '65536'
        type: string
      profile_editor:
        description: 'Run macOS editor profile (up to 2 MiB); defaults: 60s, 4096 MiB RSS, 0.5s poll'
        default: true
        type: boolean
      profile_seconds:
        description: 'macOS editor watchdog wall seconds'
        default: '60'
        type: string
      profile_rss_mib:
        description: 'macOS editor process-group sampled RSS ceiling MiB'
        default: '4096'
        type: string
      profile_poll_seconds:
        description: 'macOS editor watchdog sampling interval seconds'
        default: '0.5'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design-contracts:
    name: Design contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate opt-in profile bounds
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != ''
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
          PROFILE_EDITOR: ${{ inputs.profile_editor }}
          PROFILE_SECONDS: ${{ inputs.profile_seconds }}
          PROFILE_RSS_MIB: ${{ inputs.profile_rss_mib }}
          PROFILE_POLL_SECONDS: ${{ inputs.profile_poll_seconds }}
        run: |
          python3 - <<'PY'
          import math
          import os
          import sys

          size = os.environ['PROFILE_BYTES']
          if size not in {'65536', '2097152', '16777216'}:
              sys.exit('profile_bytes must be 65536, 2097152, or 16777216')
          if os.environ['PROFILE_EDITOR'].lower() != 'true':
              raise SystemExit(0)
          if size == '16777216':
              sys.exit('16 MiB editor profile is disabled; the previous sandbox widget run did not complete and the RSS sampler is not a hard allocation limit')
          try:
              seconds, rss_mib, poll_seconds = map(float, (
                  os.environ['PROFILE_SECONDS'], os.environ['PROFILE_RSS_MIB'],
                  os.environ['PROFILE_POLL_SECONDS']))
          except ValueError:
              sys.exit('editor watchdog inputs must be finite positive numbers')
          if (not all(map(math.isfinite, (seconds, rss_mib, poll_seconds)))
                  or not 0 < seconds <= 120
                  or not 0 < rss_mib <= 4096
                  or not 0.05 <= poll_seconds <= 0.5):
              sys.exit('editor watchdog bounds: seconds <= 120, RSS <= 4096 MiB, poll 0.05–0.5 seconds')
          PY
      - name: Validate design contracts
        run: python3 design/specs/validate_specs.py

  flutter-tests:
    name: Flutter format, analysis, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tools
      - name: Analyze Flutter code
        run: flutter analyze --no-pub
      - name: Test external profile watchdog
        run: python3 -m unittest tools/test_watch_import_profile.py
      - name: Test sanitized Linux portal failure stages
        run: python3 -m unittest tools/test_linux_portal_probe.py
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Test configured Replace All budget
        run: flutter test --no-pub tools/replace_all_budget_test.dart --dart-define=KOTOHA_REPLACE_ALL_OUTPUT_LIMIT=16 --reporter expanded

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Set up Java for Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      # Privacy callbacks and bounded model-terms import coverage; native
      # accessibility/input is checked by Flutter widget tests on the hosted
      # runners. Shell-injected key delivery varies between identical hosted
      # runs, so MainActivityAccessibilityTest is retained in the sources but
      # is not a CI gate. Not live DocumentsUI/provider or physical-device coverage.
      - name: Check privacy and model import on Android Emulator
        timeout-minutes: 15
        env:
          ANDROID_SYSTEM_IMAGE: system-images;android-35;default;x86_64
          ANDROID_AVD_DEVICE: pixel_2
          ANDROID_BOOT_TIMEOUT_SECONDS: '180'
          ANDROID_BOOT_POLL_SECONDS: '2'
          ANDROID_TEST_TIMEOUT: 7m
          # Bound failure-only log capture if the emulator has gone offline.
          ANDROID_LOGCAT_CAPTURE_TIMEOUT_SECONDS: '10'
          ANDROID_AX_TIMEOUT_MILLIS: '10000'
          ANDROID_AX_POLL_MILLIS: '100'
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager "platform-tools" "emulator" "$ANDROID_SYSTEM_IMAGE"
          echo no | avdmanager create avd --force --name kotoha-privacy \
            --package "$ANDROID_SYSTEM_IMAGE" --device "$ANDROID_AVD_DEVICE"
          test -s "$ANDROID_AVD_HOME/kotoha-privacy.ini" || {
            echo "AVD metadata missing from $ANDROID_AVD_HOME" >&2
            exit 1
          }
          emulator -avd kotoha-privacy -port 5554 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on \
            > "$RUNNER_TEMP/kotoha-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            tail -n 80 "$RUNNER_TEMP/kotoha-emulator.log"
          }
          capture_profile() {
            if ! timeout --kill-after=1s "${ANDROID_LOGCAT_CAPTURE_TIMEOUT_SECONDS}s" \
                adb logcat -d -s KotohaImportProfile:I; then
              echo "Android profile logcat capture unavailable or timed out" >&2
            fi
          }
          trap cleanup EXIT
          export emulator_pid
          timeout "${ANDROID_BOOT_TIMEOUT_SECONDS}s" bash -c '
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do
              kill -0 "$emulator_pid" || exit 1
              sleep "$ANDROID_BOOT_POLL_SECONDS"
            done
          '
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          # Attempt bounded native profile capture even when tests fail.
          if [[ -n "$PROFILE_BYTES" ]]; then
            adb logcat -c
            trap 'capture_profile; cleanup' EXIT
          fi
          cd android
          timeout "$ANDROID_TEST_TIMEOUT" ./gradlew --no-daemon :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=org.kotoha.app.MainActivityPrivacyTest,org.kotoha.app.TextImportTest,org.kotoha.app.ModelPackageTest \
            -Pandroid.testInstrumentationRunnerArguments.axTimeoutMillis="$ANDROID_AX_TIMEOUT_MILLIS" \
            -Pandroid.testInstrumentationRunnerArguments.axPollMillis="$ANDROID_AX_POLL_MILLIS" \
            -Pandroid.testInstrumentationRunnerArguments.profileBytes="$PROFILE_BYTES"

  # Isolate platform test failures so iOS simulator UI issues do not suppress
  # the separate macOS accessibility probe (or vice versa).
  ios:
    name: iOS debug build and simulator tests
    runs-on: macos-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign --no-pub
      # Native cover callbacks and simulator boot coverage only. The language-field
      # XCUI runtime gate runs in its own job below. Missing profiles still fail.
      - name: Test iOS privacy callbacks on Simulator
        timeout-minutes: 15
        env:
          IOS_SIMULATOR_OS: '26.2'
          IOS_SIMULATOR_DEVICE: iPhone 17
          IOS_DESTINATION_TIMEOUT_SECONDS: '60'
          IOS_TEST_TIMEOUT_SECONDS: '120'
          IOS_AX_TIMEOUT_SECONDS: '10'
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        run: |
          set -euo pipefail
          # Xcode forwards TEST_RUNNER_* to XCTest with the prefix stripped.
          TEST_RUNNER_KOTOHA_IMPORT_PROFILE_BYTES="$PROFILE_BYTES" \
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,OS=$IOS_SIMULATOR_OS,name=$IOS_SIMULATOR_DEVICE" \
            -destination-timeout "$IOS_DESTINATION_TIMEOUT_SECONDS" \
            -only-testing:RunnerTests/RunnerTests \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance "$IOS_TEST_TIMEOUT_SECONDS" \
            -maximum-test-execution-time-allowance "$IOS_TEST_TIMEOUT_SECONDS" \
            KOTOHA_AX_TIMEOUT_SECONDS="$IOS_AX_TIMEOUT_SECONDS" CODE_SIGNING_ALLOWED=NO

  ios-xcui-runtime:
    name: iOS language-field XCUI runtime
    runs-on: macos-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign --no-pub
      # Execute the XCUI target as a runtime gate. The keyboard-existence waits in
      # this target were replaced by focus/value assertions on native fields.
      - name: Run language-field accessibility XCUI tests on Simulator
        timeout-minutes: 30
        env:
          IOS_SIMULATOR_OS: '26.2'
          IOS_SIMULATOR_DEVICE: iPhone 17
          IOS_DESTINATION_TIMEOUT_SECONDS: '60'
          IOS_TEST_TIMEOUT_SECONDS: '120'
          # The suite requests executionTimeAllowance = 300 on a slow hosted
          # runner; the maximum flag is an absolute ceiling, so it must cover
          # that request while the default stays 120 for other tests.
          IOS_TEST_MAX_TIMEOUT_SECONDS: '300'
          IOS_AX_TIMEOUT_SECONDS: '10'
        run: |
          set -euo pipefail
          export KOTOHA_AX_TIMEOUT_SECONDS="$IOS_AX_TIMEOUT_SECONDS"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,OS=$IOS_SIMULATOR_OS,name=$IOS_SIMULATOR_DEVICE" \
            -destination-timeout "$IOS_DESTINATION_TIMEOUT_SECONDS" \
            -only-testing:RunnerUITests/LanguageFieldAccessibilityTests \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance "$IOS_TEST_TIMEOUT_SECONDS" \
            -maximum-test-execution-time-allowance "$IOS_TEST_MAX_TIMEOUT_SECONDS" \
            KOTOHA_AX_TIMEOUT_SECONDS="$IOS_AX_TIMEOUT_SECONDS" CODE_SIGNING_ALLOWED=NO

  macos-export-permissions:
    name: macOS text export permissions (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify runner architecture and export permissions
        timeout-minutes: 5
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          flutter test --no-pub test/text_export_test.dart --reporter expanded

  macos:
    name: macOS debug build
    runs-on: macos-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Profile desktop disk read and strict decode
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != ''
        timeout-minutes: 5
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        run: flutter test --no-pub tools/profile_text_import_test.dart --dart-define=PROFILE_BYTES="$PROFILE_BYTES" --dart-define=PROFILE_STAGE=decode
      - name: Profile macOS debug editor with external watchdog
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != '' && inputs.profile_editor
        timeout-minutes: 5
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
          PROFILE_SECONDS: ${{ inputs.profile_seconds }}
          PROFILE_RSS_MIB: ${{ inputs.profile_rss_mib }}
          PROFILE_POLL_SECONDS: ${{ inputs.profile_poll_seconds }}
        run: >-
          python3 tools/watch_import_profile.py --seconds "$PROFILE_SECONDS"
          --rss-mib "$PROFILE_RSS_MIB" --poll-seconds "$PROFILE_POLL_SECONDS" --
          flutter test --no-pub tools/profile_text_import_test.dart
          --dart-define=PROFILE_BYTES="$PROFILE_BYTES" --dart-define=PROFILE_STAGE=editor
      - name: Build unsigned macOS app
        run: flutter build macos --debug --no-pub

  windows:
    name: Windows debug build
    runs-on: windows-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable Windows desktop target
        run: flutter config --enable-windows-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test Windows DPAPI key preservation
        run: flutter test --no-pub test/windows_dpapi_test.dart
      - name: Test Windows text export permissions
        timeout-minutes: 5
        run: flutter test --no-pub test/text_export_test.dart --reporter expanded
      - name: Profile desktop disk read and strict decode
        if: github.event_name == 'workflow_dispatch' && inputs.profile_bytes != ''
        timeout-minutes: 5
        env:
          PROFILE_BYTES: ${{ inputs.profile_bytes }}
        run: flutter test --no-pub tools/profile_text_import_test.dart --dart-define=PROFILE_BYTES="$env:PROFILE_BYTES" --dart-define=PROFILE_STAGE=decode
      - name: Test Windows import summary parser
        run: python tools/engine_probe/test_windows_import_summary.py
      - name: Build Windows debug app
        run: flutter build windows --debug --no-pub
      - name: Build Windows Release app
        run: flutter build windows --release --no-pub
      - name: Capture sanitized Release runner imports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found; import capture missing' }
          python tools/engine_probe/windows_import_summary.py --exe build/windows/x64/runner/Release/kotoha.exe --dumpbin $dumpbin --output windows-release-import-summary.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain sanitized Release runner import summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-import-summary
          path: windows-release-import-summary.json
          if-no-files-found: error
      - name: Capture sanitized Release runtime providers before entrypoint
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found; runtime provider capture missing' }
          $exe = (Resolve-Path 'build/windows/x64/runner/Release/kotoha.exe').Path
          $linkage = Join-Path $env:RUNNER_TEMP 'kotoha-release-linkage.txt'
          try {
            & $dumpbin /HEADERS /DEPENDENTS $exe > $linkage
            if ($LASTEXITCODE -ne 0) { throw 'dumpbin linkage capture failed' }
            python tools/engine_probe/runtime_providers.py --executable $exe --linkage-log $linkage --output windows-release-runtime-providers
            $captureExit = $LASTEXITCODE
          } finally {
            if (Test-Path -LiteralPath $linkage) { Remove-Item -LiteralPath $linkage -Force }
          }
          if ($captureExit -ne 0) { exit $captureExit }
      - name: Retain sanitized Release runtime provider evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-runtime-providers
          path: |
            windows-release-runtime-providers/runtime-providers.json
            windows-release-runtime-providers/runtime-summary.txt
          if-no-files-found: error


  linux-portal-runtime-probe:
    name: Linux portal runtime probe (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install portal runtime and headless session tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bubblewrap dbus-x11 fuse3 python3-dbus python3-gi xvfb \
            xdg-desktop-portal xdg-desktop-portal-gtk
          cat /etc/os-release
          printf 'runner architecture: '
          uname -m
          printf 'dpkg architecture: '
          dpkg --print-architecture
          dpkg-query -W -f='${binary:Package} ${Version}\n' \
            bubblewrap dbus-x11 fuse3 python3-dbus python3-gi xvfb \
            xdg-desktop-portal xdg-desktop-portal-gtk
      - name: Validate private-root preflight executables
        env:
          KOTOHA_RUN_BWRAP_INTEGRATION: "1"
        run: python3 -m unittest tools/test_linux_portal_probe.py
      - name: Start isolated portal and introspect its interfaces
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CURRENT_DESKTOP=GNOME
          export GTK_USE_PORTAL=1
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/xdg-runtime.XXXXXX")"
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          cleanup_runtime_dir() {
            local status=$?
            trap - EXIT
            if mountpoint -q "$runtime_dir/doc" &&
                ! fusermount3 -u "$runtime_dir/doc"; then
              echo "Could not unmount the Documents portal runtime directory" >&2
              [[ $status -ne 0 ]] || status=1
            fi
            if ! rm -rf -- "$runtime_dir"; then
              echo "Could not remove the isolated XDG runtime directory" >&2
              [[ $status -ne 0 ]] || status=1
            fi
            exit "$status"
          }
          trap cleanup_runtime_dir EXIT
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            for attempt in {1..30}; do
              if dbus-send --session --type=method_call \
                  --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                  org.freedesktop.DBus.StartServiceByName \
                  string:org.freedesktop.portal.Desktop uint32:0 >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            for attempt in {1..30}; do
              if dbus-send --session --type=method_call \
                  --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                  org.freedesktop.DBus.StartServiceByName \
                  string:org.freedesktop.impl.portal.desktop.gtk uint32:0 >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            for attempt in {1..20}; do
              if busctl --user introspect org.freedesktop.portal.Desktop \
                  /org/freedesktop/portal/desktop \
                  > "$RUNNER_TEMP/portal-interfaces.txt" 2>&1; then
                break
              fi
              sleep 1
            done
            cat "$RUNNER_TEMP/portal-interfaces.txt"
            grep -q "org.freedesktop.portal.FileChooser" \
              "$RUNNER_TEMP/portal-interfaces.txt" || {
                echo "FileChooser interface was not introspected on the portal" >&2
                exit 1
              }
            busctl --user introspect org.freedesktop.impl.portal.desktop.gtk \
              /org/freedesktop/portal/desktop \
              > "$RUNNER_TEMP/gtk-backend-interfaces.txt"
            cat "$RUNNER_TEMP/gtk-backend-interfaces.txt"
            grep -q "org.freedesktop.impl.portal.FileChooser" \
              "$RUNNER_TEMP/gtk-backend-interfaces.txt" || {
                echo "FileChooser interface was not introspected on the GTK backend" >&2
                exit 1
              }
          '

      - name: Probe FileChooser registration and Documents revocation in a sandbox
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          probe_root="$(mktemp -d "$RUNNER_TEMP/xdg-portal-probe.XXXXXX")"
          runtime_dir="$(mktemp -d /tmp/kotoha-portal-runtime.XXXXXX)"
          chmod 700 "$probe_root" "$runtime_dir"
          mkdir -p "$probe_root/home" "$probe_root/data" "$probe_root/config"
          export HOME="$probe_root/home"
          export XDG_DATA_HOME="$probe_root/data"
          export XDG_CONFIG_HOME="$probe_root/config"
          export XDG_RUNTIME_DIR="$runtime_dir"
          # xdg-desktop-portal 1.14.4 loads backend .portal files only from
          # XDG_DESKTOP_PORTAL_DIR, not XDG_DATA_HOME or a portals.conf.
          export XDG_DESKTOP_PORTAL_DIR="$probe_root/data/xdg-desktop-portal/portals"
          export XDG_CURRENT_DESKTOP=kotoha_portal_test
          export XDG_DATA_DIRS="$probe_root/data:/usr/local/share:/usr/share"
          export KOTOHA_PORTAL_PROBE_ROOT="$probe_root"
          cleanup() {
            local status=$?
            trap - EXIT
            if mountpoint -q "$runtime_dir/doc"; then
              if ! fusermount3 -u "$runtime_dir/doc" >/dev/null 2>&1; then
                echo "Documents portal FUSE mount cleanup failed" >&2
                status=1
              fi
            fi
            if mountpoint -q "$runtime_dir/doc"; then
              echo "Retaining mounted Documents portal runtime path" >&2
              status=1
            else
              if ! rm -rf -- "$runtime_dir" "$probe_root" >/dev/null 2>&1; then
                echo "Portal probe temporary-state cleanup failed" >&2
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          # The sandbox masks /tmp and unshares networking; keep the session-bus
          # socket under the runtime directory that its bwrap prefix explicitly binds.
          session_config="$probe_root/dbus-session.conf"
          python3 - "$session_config" "$runtime_dir/bus" <<'PYTHON'
          from pathlib import Path
          import sys

          source = Path("/usr/share/dbus-1/session.conf").read_text(encoding="utf-8")
          default_listener = "<listen>unix:tmpdir=/tmp</listen>"
          socket_path = sys.argv[2]
          allowed = "/tmp/kotoha-portal-runtime."
          if (
              source.count(default_listener) != 1
              or not socket_path.startswith(allowed)
              or any(
                  not (char.isascii() and (char.isalnum() or char in "/._-"))
                  for char in socket_path
              )
          ):
              raise SystemExit("Unexpected D-Bus session configuration")
          Path(sys.argv[1]).write_text(
              source.replace(default_listener, f"<listen>unix:path={socket_path}</listen>"),
              encoding="utf-8",
          )
          PYTHON
          portal_log="$probe_root/portal-session.log"
          if timeout --kill-after=2s 60s dbus-run-session \
              --config-file="$session_config" -- python3 tools/linux_portal_probe.py >"$portal_log" 2>&1; then
            python3 - "$portal_log" <<'PYTHON'
          import json
          import sys

          required = {
              "filechooser_version", "documents_version", "test_app_id",
              "backend_app_id_matches", "returned_uri_mapped_to_documents_mount",
              "fixture_path_hidden_from_client", "fixture_sha256", "read_bytes",
              "self_revoke_succeeded",
              "post_close_open_denied", "persistent_document_record_retained",
              "app_permissions_remaining",
          }
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  result = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(result, dict) and required <= result.keys():
                  print(json.dumps(result, sort_keys=True))
                  break
          else:
              raise SystemExit("Linux portal probe produced no sanitized result")
          PYTHON
          else
            status=$?
            grep -E '^Linux portal probe failed: [a-z0-9-]+$' "$portal_log" | tail -n 1 || \
              echo "Linux portal probe failed (details suppressed)" >&2
            exit "$status"
          fi
