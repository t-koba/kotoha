name: CI

on:
  push:
    branches:
      - dev
      - mizu
      - mizu/dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design-contracts:
    name: Design contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate design contracts
        run: python3 design/specs/validate_specs.py

  flutter-tests:
    name: Flutter format, analysis, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter code
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Set up Java for Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  apple:
    name: iOS and macOS debug builds
    runs-on: macos-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign --no-pub
      - name: Build unsigned macOS app
        run: flutter build macos --debug --no-codesign --no-pub

  windows:
    name: Windows debug build
    runs-on: windows-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable Windows desktop target
        run: flutter config --enable-windows-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test Windows DPAPI key preservation
        run: flutter test --no-pub test/windows_dpapi_test.dart
      - name: Build Windows debug app
        run: flutter build windows --debug --no-pub
