name: CI

on:
  push:
    branches:
      - dev
      - mizu
      - mizu/dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design-contracts:
    name: Design contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate design contracts
        run: python3 design/specs/validate_specs.py

  flutter-tests:
    name: Flutter format, analysis, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter code
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Set up Java for Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      # Callback/flag coverage only: not every launcher/OEM recents snapshot or
      # physical-device behavior, nor image capture or Flutter draft/focus restoration.
      - name: Check task-switcher flags on Android Emulator
        timeout-minutes: 15
        env:
          ANDROID_SYSTEM_IMAGE: system-images;android-35;default;x86_64
          ANDROID_AVD_DEVICE: pixel_2
          ANDROID_BOOT_TIMEOUT_SECONDS: '180'
          ANDROID_BOOT_POLL_SECONDS: '2'
          ANDROID_TEST_TIMEOUT: 7m
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager "platform-tools" "emulator" "$ANDROID_SYSTEM_IMAGE"
          echo no | avdmanager create avd --force --name kotoha-privacy \
            --package "$ANDROID_SYSTEM_IMAGE" --device "$ANDROID_AVD_DEVICE"
          emulator -avd kotoha-privacy -port 5554 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on \
            > "$RUNNER_TEMP/kotoha-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            tail -n 80 "$RUNNER_TEMP/kotoha-emulator.log"
          }
          trap cleanup EXIT
          export emulator_pid
          timeout "${ANDROID_BOOT_TIMEOUT_SECONDS}s" bash -c '
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do
              kill -0 "$emulator_pid" || exit 1
              sleep "$ANDROID_BOOT_POLL_SECONDS"
            done
          '
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          cd android
          timeout "$ANDROID_TEST_TIMEOUT" ./gradlew --no-daemon :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=org.kotoha.app.MainActivityPrivacyTest

  apple:
    name: iOS and macOS debug builds
    runs-on: macos-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign --no-pub
      # Native scene callback/cover behavior only: no Dart draft/focus or actual
      # task-switcher snapshot assertions. Missing pinned profiles fail, not skip.
      - name: Test iOS privacy cover on Simulator
        timeout-minutes: 15
        env:
          IOS_SIMULATOR_OS: '26.2'
          IOS_SIMULATOR_DEVICE: iPhone 17
          IOS_DESTINATION_TIMEOUT_SECONDS: '60'
          IOS_TEST_TIMEOUT_SECONDS: '60'
        run: |
          set -euo pipefail
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,OS=$IOS_SIMULATOR_OS,name=$IOS_SIMULATOR_DEVICE" \
            -destination-timeout "$IOS_DESTINATION_TIMEOUT_SECONDS" \
            -only-testing:RunnerTests/RunnerTests/testPrivacyCoverIsIdempotentAndLeavesContentAttached \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance "$IOS_TEST_TIMEOUT_SECONDS" \
            -maximum-test-execution-time-allowance "$IOS_TEST_TIMEOUT_SECONDS" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned macOS app
        run: flutter build macos --debug --no-pub

  windows:
    name: Windows debug build
    runs-on: windows-latest
    needs: [design-contracts, flutter-tests]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true
      - name: Enable Windows desktop target
        run: flutter config --enable-windows-desktop
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test Windows DPAPI key preservation
        run: flutter test --no-pub test/windows_dpapi_test.dart
      - name: Build Windows debug app
        run: flutter build windows --debug --no-pub
